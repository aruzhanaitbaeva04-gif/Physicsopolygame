<title>PHYSICSOPOLY: Менің физика алаңым</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,600;0,700;0,800;0,900;1,800;1,900&family=Noto+Sans:wght@400;600;700;800&family=Great+Vibes&display=swap">
<style>
/* Layout: the printed board is the hero — a 15×10 ring of square cells on a light-blue field, the printed centre artwork (title + six section panels) inside; a control rail sits beside it (below it on phones). */
:root{
  --chalk:#c6ebff;          /* board background (new printed board) */
  --chalk-deep:#0b3d91;
  --chalk-line:rgba(0,69,178,.10);
  --paper:#ffffff;
  --ink:#1b1512;
  --ink-soft:#3d5270;
  --kk:#1800ad;             /* card Kazakh line colour (from print) */
  --ru:#ff3131;             /* card Russian line colour */
  --en:#000000;
  --rail:#f7fbff;
  --rail-line:#cfe2f3;
  --focus:#ffd400;
  --good:#138a3e; --bad:#c62828;
  --s-mech:#1bad4a; --s-mol:#0045b2; --s-elec:#ffcd31; --s-wave:#7d49f9; --s-opt:#ff5eaa; --s-atom:#40d9ff;
  --f-display:"Montserrat","Arial Black","Segoe UI",system-ui,sans-serif;
  --f-body:"Noto Sans","Segoe UI",Roboto,Arial,sans-serif;
  --f-script:"Great Vibes","Brush Script MT",cursive;
  --fs:1;
  --chalkbg:url("data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20width%3D%22900%22%20height%3D%22860%22%20font-family%3D%22Comic%20Sans%20MS%2CSegoe%20Print%2Ccursive%22%20fill%3D%22rgba%280%2C69%2C178%2C0.07%29%22%3E%3Ctext%20x%3D%22251%22%20y%3D%2240%22%20font-size%3D%2225%22%20transform%3D%22rotate%28-5%20251%2040%29%22%3EF%20%3D%20ma%3C/text%3E%3Ctext%20x%3D%22748%22%20y%3D%2292%22%20font-size%3D%2237%22%20transform%3D%22rotate%28-2%20748%2092%29%22%3EE%20%3D%20mc%C2%B2%3C/text%3E%3Ctext%20x%3D%22168%22%20y%3D%22144%22%20font-size%3D%2224%22%20transform%3D%22rotate%28-12%20168%20144%29%22%3E%CE%94p%20%3D%20F%CE%94t%3C/text%3E%3Ctext%20x%3D%2230%22%20y%3D%22196%22%20font-size%3D%2231%22%20transform%3D%22rotate%28-2%2030%20196%29%22%3ES%20%3D%20v%E2%82%80t%20%2B%20at%C2%B2/2%3C/text%3E%3Ctext%20x%3D%22793%22%20y%3D%22248%22%20font-size%3D%2229%22%20transform%3D%22rotate%28-13%20793%20248%29%22%3E%CE%BB%20%3D%20v/T%3C/text%3E%3Ctext%20x%3D%22542%22%20y%3D%22300%22%20font-size%3D%2233%22%20transform%3D%22rotate%283%20542%20300%29%22%3E%CE%A3F%20%3D%200%3C/text%3E%3Ctext%20x%3D%22293%22%20y%3D%22352%22%20font-size%3D%2227%22%20transform%3D%22rotate%2810%20293%20352%29%22%3EP%20%3D%20F/S%3C/text%3E%3Ctext%20x%3D%22118%22%20y%3D%22404%22%20font-size%3D%2228%22%20transform%3D%22rotate%28-6%20118%20404%29%22%3E%CF%81%20%3D%20m/V%3C/text%3E%3Ctext%20x%3D%2236%22%20y%3D%22456%22%20font-size%3D%2230%22%20transform%3D%22rotate%2812%2036%20456%29%22%3EEk%20%3D%20mv%C2%B2/2%3C/text%3E%3Ctext%20x%3D%22288%22%20y%3D%22508%22%20font-size%3D%2227%22%20transform%3D%22rotate%28-8%20288%20508%29%22%3EI%20%3D%20U/R%3C/text%3E%3Ctext%20x%3D%22327%22%20y%3D%22560%22%20font-size%3D%2233%22%20transform%3D%22rotate%28-5%20327%20560%29%22%3Esin%20%CE%B1%20/%20sin%20%CE%B2%20%3D%20n%3C/text%3E%3Ctext%20x%3D%2298%22%20y%3D%22612%22%20font-size%3D%2232%22%20transform%3D%22rotate%2813%2098%20612%29%22%3EQ%20%3D%20cm%CE%94t%3C/text%3E%3Ctext%20x%3D%22697%22%20y%3D%22664%22%20font-size%3D%2238%22%20transform%3D%22rotate%28-2%20697%20664%29%22%3ET%20%3D%202%CF%80%E2%88%9A%28l/g%29%3C/text%3E%3Ctext%20x%3D%22264%22%20y%3D%22716%22%20font-size%3D%2229%22%20transform%3D%22rotate%28-9%20264%20716%29%22%3EpV%20%3D%20%CE%BDRT%3C/text%3E%3Ctext%20x%3D%22494%22%20y%3D%22768%22%20font-size%3D%2224%22%20transform%3D%22rotate%28-6%20494%20768%29%22%3Ev%20%3D%20%CE%BB%CE%BD%3C/text%3E%3Ctext%20x%3D%22570%22%20y%3D%22820%22%20font-size%3D%2231%22%20transform%3D%22rotate%2812%20570%20820%29%22%3EA%20%3D%20Fs%3C/text%3E%3C/svg%3E");
  color-scheme:light;
}
/* high-contrast (accessibility) palette: black ground, bright frames, no faint text */
:root[data-hc="1"]{
  --chalk:#000; --chalk-deep:#000; --chalk-line:rgba(255,255,255,0);
  --paper:#000; --ink:#fff; --ink-soft:#ffef7a; --kk:#7fd4ff; --ru:#ff8a8a; --en:#ffffff;
  --rail:#000; --rail-line:#fff; --focus:#00e5ff;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--chalk-deep);color:var(--ink);font-family:var(--f-body);font-size:calc(15px * var(--fs));line-height:1.45;-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--chalk-deep)}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:4px solid var(--focus);outline-offset:3px;border-radius:6px}
.sr{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.app{min-height:100%;display:flex;flex-direction:column;background:var(--chalk) var(--chalkbg) repeat;background-size:900px auto}
:root[data-hc="1"] .app{background-image:none}

/* ---------- header ---------- */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;background:var(--chalk-deep);color:#fff;border-bottom:3px solid rgba(255,255,255,.18);
  padding-block:8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;min-width:0;margin-right:auto}
.brand .script{font-family:var(--f-script);font-size:calc(30px * var(--fs));line-height:1;color:#fff}
.brand .band{font-family:var(--f-display);font-weight:900;font-style:italic;letter-spacing:.02em;font-size:calc(15px * var(--fs));background:#fff;color:var(--chalk-deep);padding:4px 10px;border-radius:3px;white-space:nowrap}
:root[data-hc="1"] .brand .band{background:#ffef00;color:#000}
.tools{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.tbtn{display:inline-flex;align-items:center;gap:6px;border:2px solid rgba(255,255,255,.35);background:rgba(255,255,255,.08);color:#fff;border-radius:999px;padding:6px 12px;font-weight:700;font-size:calc(13px * var(--fs));min-height:40px}
.tbtn:hover{background:rgba(255,255,255,.18)}
.tbtn svg{width:18px;height:18px;flex:none}
.tbtn.a11y{background:#ffde59;color:#2a1a00;border-color:#ffde59}
.clock{font-family:var(--f-display);font-weight:800;font-variant-numeric:tabular-nums;font-size:calc(15px * var(--fs));padding:6px 12px;border-radius:8px;background:rgba(0,0,0,.25);min-height:40px;display:inline-flex;align-items:center;gap:6px}
.clock.low{background:#ffde59;color:#3a1500}
select.tsel{border:2px solid rgba(255,255,255,.35);background:var(--chalk-deep);color:#fff;border-radius:999px;padding:6px 10px;font-weight:700;min-height:40px}

/* ---------- main layout ---------- */
.main{flex:1;display:grid;grid-template-columns:minmax(0,1fr) minmax(280px,340px);gap:18px;align-items:start;
  padding-block:16px 28px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));max-width:1500px;width:100%;margin:0 auto}
@media (max-width:980px){.main{grid-template-columns:minmax(0,1fr)}}

/* ---------- board ---------- */
.boardwrap{container-type:inline-size;min-width:0}
.board{position:relative;display:grid;grid-template-columns:repeat(15,1fr);grid-template-rows:repeat(10,1fr);gap:.55cqw;aspect-ratio:15/10.1;max-width:100%;
  padding:1.2cqw;border-radius:1.2cqw;background:#d6f1ff;border:.35cqw solid #fff;box-shadow:0 .6cqw 1.6cqw rgba(11,61,145,.18)}
.cell{position:relative;display:flex;align-items:center;justify-content:center;border:0;border-radius:.35cqw;padding:0;
  font-family:var(--f-display);font-weight:900;font-size:3.6cqw;color:#fff;line-height:1;
  text-shadow:0 .12cqw 0 rgba(0,0,0,.18);box-shadow:0 .25cqw 0 rgba(0,0,0,.22);transition:transform .15s}
.cell.light{color:#fff;text-shadow:0 0 .35cqw rgba(0,0,0,.28),0 .12cqw 0 rgba(0,0,0,.22)}
.cell:hover{transform:translateY(-.2cqw)}
.cell.v span{transform:rotate(-90deg)}
.cell.v.r span{transform:rotate(-90deg)}
.cell.here{outline:.45cqw solid #fff;outline-offset:.15cqw;z-index:2}
:root[data-hc="1"] .cell{color:#000;text-shadow:none;border:.35cqw solid #fff}
:root[data-hc="1"] .cell.dark{color:#fff}
.start{background:#fff;color:#000;flex-direction:column;justify-content:space-between;padding:.4cqw 0;overflow:hidden;font-size:1.25cqw;letter-spacing:.02em}
.start .flags{width:100%;height:42%;background:conic-gradient(#111 25%,#fff 0 50%,#111 0 75%,#fff 0) 0 0/1.1cqw 1.1cqw;border-bottom:.2cqw solid #111}
.start .lbl{display:flex;width:100%;flex:1}
.start .lbl b{flex:1;display:flex;align-items:center;justify-content:center;writing-mode:vertical-rl;transform:rotate(180deg);font-size:1.25cqw}
.start .lbl b+b{background:#111;color:#fff}
.inner{grid-column:2/15;grid-row:2/10;position:relative;margin:.7cqw;border:.3cqw solid #fff;border-radius:.8cqw;overflow:hidden;background:#d8f2ff center/100% 100% no-repeat;display:flex;align-items:center;justify-content:center;pointer-events:none}
.panels{pointer-events:auto;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(2,1fr);width:76%;height:86%}
.panel{position:relative;border:0;padding:1.2cqw;display:flex;cursor:pointer;background:var(--c)}
.panel .pin{flex:1;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.6cqw;text-align:center;position:relative;overflow:hidden;padding:.6cqw}
.panel .art{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;opacity:.16}
.panel .art img,.panel .art svg{max-width:70%;max-height:80%}
.panel .en,.panel .ru{font-family:var(--f-display);font-weight:800;font-size:1.05cqw;color:#000;position:relative;line-height:1.15}
.panel .kk{font-family:var(--f-display);font-weight:900;font-size:1.75cqw;color:#000;position:relative;line-height:1.08;text-wrap:balance}
.panel .rule{width:50%;height:.12cqw;background:#000;position:relative}
.panel:hover .pin{background:#fffbe6}
:root[data-hc="1"] .panel .pin{background:#000}
:root[data-hc="1"] .panel .en,:root[data-hc="1"] .panel .ru,:root[data-hc="1"] .panel .kk{color:#fff}
:root[data-hc="1"] .panel .rule{background:#fff}
.deco{position:absolute;pointer-events:none}
.deco.prof{left:-1.2cqw;bottom:2%;width:12cqw}
.deco.atom{right:5%;top:-3.2cqw;width:7.5cqw;transform:rotate(-12deg)}
:root[data-hc="1"] .deco{display:none}
/* new board: the printed centre artwork is the background; transparent buttons sit over its six panels */
.inner.art .panels{position:absolute;left:2.07%;top:27.78%;width:95.9%;height:69.46%;column-gap:1.1%;row-gap:2.16%}
.inner.art .panel{background:transparent;padding:0;border-radius:.7cqw}
.inner.art .panel .pin{opacity:0}
.inner.art .panel:hover,.inner.art .panel:focus-visible{box-shadow:0 0 0 .3cqw #fff,0 0 0 .55cqw var(--c)}
:root[data-hc="1"] .inner.art{background:#000!important}
:root[data-hc="1"] .board{background:#000;border-color:#fff;box-shadow:none}
:root[data-hc="1"] .inner.art .panel{background:var(--c);padding:.5cqw}
:root[data-hc="1"] .inner.art .panel .pin{opacity:1}
.cell.gift{background:#fff}
.cell.gift img{width:80%;height:80%;object-fit:contain;pointer-events:none}
:root[data-hc="1"] .cell.gift{background:#fff;border-color:#ffef00}

/* tokens */
.tokens{position:absolute;inset:0;pointer-events:none}
.tok{position:absolute;width:var(--ts);height:var(--ts);margin:calc(var(--ts) / -2) 0 0 calc(var(--ts) / -2);border-radius:50%;
  background:var(--tc);border:.35cqw solid #fff;box-shadow:0 .4cqw .6cqw rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;
  transition:left .22s cubic-bezier(.3,.7,.4,1.4),top .22s cubic-bezier(.3,.7,.4,1.4);z-index:5}
.tok svg{width:62%;height:62%;color:var(--ti)}
.tok.active{animation:pulse 1.4s ease-in-out infinite;z-index:6}
.tok.hop{animation:hop .22s ease-out}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(255,255,255,.9),0 .4cqw .6cqw rgba(0,0,0,.45)}50%{box-shadow:0 0 0 .9cqw rgba(255,255,255,0),0 .4cqw .6cqw rgba(0,0,0,.45)}}
@keyframes hop{0%{transform:translateY(0)}50%{transform:translateY(-1.4cqw) scale(1.08)}100%{transform:translateY(0)}}

/* ---------- side rail ---------- */
.rail{display:flex;flex-direction:column;gap:14px;min-width:0}
.box{background:var(--rail);border:2px solid var(--rail-line);border-radius:14px;padding:14px;min-width:0}
.box h2{margin:0 0 10px;font-family:var(--f-display);font-weight:900;font-size:calc(13px * var(--fs));letter-spacing:.08em;text-transform:uppercase;color:var(--ink-soft)}
.turn{display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center}
.turnname{display:flex;align-items:center;gap:10px;font-family:var(--f-display);font-weight:900;font-size:calc(20px * var(--fs));line-height:1.15}
.turnname .tk{width:38px;height:38px;flex:none}
.turnhint{font-size:calc(13.5px * var(--fs));color:var(--ink-soft);margin:0}
.dicezone{perspective:600px;width:96px;height:96px;margin:6px 0}
.dice{width:96px;height:96px;position:relative;transform-style:preserve-3d;transition:transform 1s cubic-bezier(.2,.8,.25,1)}
.face{position:absolute;inset:0;background:#fff;border:3px solid #222;border-radius:16px;display:grid;grid-template:repeat(3,1fr)/repeat(3,1fr);padding:13px;box-shadow:inset 0 0 10px rgba(0,0,0,.15)}
.face i{width:17px;height:17px;border-radius:50%;background:#111;align-self:center;justify-self:center}
.f1{transform:translateZ(48px)}.f6{transform:rotateY(180deg) translateZ(48px)}
.f2{transform:rotateY(90deg) translateZ(48px)}.f5{transform:rotateY(-90deg) translateZ(48px)}
.f3{transform:rotateX(90deg) translateZ(48px)}.f4{transform:rotateX(-90deg) translateZ(48px)}
.f1 i{background:#d62828}
.roll{width:100%;border:0;border-radius:14px;background:var(--chalk-deep);color:#fff;font-family:var(--f-display);font-weight:900;font-size:calc(17px * var(--fs));padding:14px 16px;letter-spacing:.03em;box-shadow:0 4px 0 #06275e;min-height:54px}
.roll:hover{filter:brightness(1.1)}
.roll:active{transform:translateY(2px);box-shadow:0 2px 0 #06275e}
.roll:disabled{opacity:.5;cursor:not-allowed}
:root[data-hc="1"] .roll{background:#ffef00;color:#000;box-shadow:none;border:3px solid #fff}
.row{display:flex;gap:8px;flex-wrap:wrap;width:100%}
.ghost{flex:1;border:2px solid var(--rail-line);background:transparent;border-radius:10px;padding:8px 10px;font-weight:700;font-size:calc(13px * var(--fs));min-height:42px;color:var(--ink)}
.ghost:hover{border-color:var(--ink-soft)}
.teams{display:flex;flex-direction:column;gap:8px;list-style:none;margin:0;padding:0}
.team{display:grid;grid-template-columns:34px minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px 10px;border-radius:10px;border:2px solid transparent;background:rgba(0,0,0,.03)}
.team.now{border-color:var(--chalk-deep);background:#fff}
:root[data-hc="1"] .team.now{border-color:#ffef00;background:#111}
.team .tk{width:34px;height:34px}
.team .nm{font-weight:800;font-size:calc(14.5px * var(--fs));overflow-wrap:anywhere;line-height:1.2}
.team .meta{font-size:calc(12px * var(--fs));color:var(--ink-soft);display:flex;gap:6px;flex-wrap:wrap;margin-top:2px}
.team .pts{font-family:var(--f-display);font-weight:900;font-size:calc(24px * var(--fs));font-variant-numeric:tabular-nums;min-width:2ch;text-align:right}
.chip{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:1px 8px;font-size:calc(11.5px * var(--fs));font-weight:700;background:#f0e2d8;color:#4a2b1e}
:root[data-hc="1"] .chip{background:#222;color:#fff;border:1px solid #fff}
.badge .tk{width:20px;height:20px;border-width:2px;box-shadow:none}
.chip.box{background:linear-gradient(90deg,#ff4fd8,#3e5bff);color:#fff}
.log{list-style:none;margin:0;padding:0;max-height:220px;overflow:auto;display:flex;flex-direction:column;gap:6px;font-size:calc(13px * var(--fs))}
.log li{padding:6px 8px;border-left:4px solid var(--rail-line);background:rgba(0,0,0,.025);border-radius:0 8px 8px 0}
.legend{display:grid;grid-template-columns:1fr 1fr;gap:6px 10px;font-size:calc(12.5px * var(--fs))}
.legend span{display:flex;align-items:center;gap:6px;min-width:0}
.legend i{width:14px;height:14px;border-radius:3px;flex:none}

/* ---------- token icon (shared) ---------- */
.tk{border-radius:50%;background:var(--tc);border:3px solid #fff;box-shadow:0 0 0 2px rgba(0,0,0,.35);display:inline-flex;align-items:center;justify-content:center}
.tk svg{width:62%;height:62%;color:var(--ti)}

/* ---------- dialogs ---------- */
dialog{border:0;padding:0;background:transparent;max-width:min(980px,calc(100vw - 24px));width:100%;max-height:calc(100dvh - 24px);color:var(--ink)}
dialog::backdrop{background:rgba(30,8,4,.72);backdrop-filter:blur(3px)}
.sheet{background:var(--rail);border-radius:18px;padding:22px;max-height:calc(100dvh - 24px);overflow:auto;position:relative}
.sheet h2{font-family:var(--f-display);font-weight:900;font-size:calc(24px * var(--fs));margin:0 0 6px;line-height:1.15;text-wrap:balance}
.sheet .lead{margin:0 0 16px;color:var(--ink-soft)}
.x{position:absolute;top:10px;right:10px;width:44px;height:44px;border-radius:50%;border:2px solid var(--rail-line);background:var(--rail);font-size:22px;line-height:1;font-weight:800;z-index:3}
.btn{border:0;border-radius:12px;padding:12px 18px;font-weight:800;font-size:calc(15px * var(--fs));min-height:48px;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn.pri{background:var(--chalk-deep);color:#fff}
.btn.ok{background:var(--good);color:#fff}
.btn.no{background:var(--bad);color:#fff}
.btn.sec{background:transparent;border:2px solid var(--rail-line);color:var(--ink)}
.btn svg{width:20px;height:20px}
:root[data-hc="1"] .btn.pri{background:#ffef00;color:#000}
:root[data-hc="1"] .btn{border:3px solid #fff}

/* ---------- setup ---------- */
.setup{background:var(--rail)}
.hero{position:relative;border-radius:14px;overflow:hidden;margin:-6px -6px 18px;background:#8fd0ff center/cover no-repeat;aspect-ratio:1434/700;max-height:300px;width:calc(100% + 12px);max-width:none}
.hero img{width:100%;height:100%;object-fit:cover;object-position:center 30%;display:block}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:14px}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field>label,.field>.lab{font-weight:800;font-size:calc(13px * var(--fs))}
.field select,.field input[type=text]{border:2px solid var(--rail-line);border-radius:10px;padding:10px 12px;background:var(--paper);min-height:46px;width:100%}
.seg{display:flex;flex-wrap:wrap;gap:6px}

.badge{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:4px 10px;font-weight:800;font-size:calc(12.5px * var(--fs));background:#f3ece7;color:#3a2a22}

.qlines{display:flex;flex-direction:column;gap:12px;margin:12px 0;flex:1;justify-content:center}

.say{width:46px;height:46px;border-radius:50%;border:2px solid currentColor;background:transparent;display:inline-flex;align-items:center;justify-content:center;flex:none}

.say svg{width:22px;height:22px}

.timer{display:flex;align-items:center;gap:10px;justify-content:center;margin:4px 0 10px}
.tbar{flex:1;max-width:320px;height:10px;border-radius:99px;background:#eee;overflow:hidden}

.cact{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:8px}
.helpers{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-top:10px}
.helpers button{border:2px dashed #b04ad6;background:#fbf0ff;color:#4b1466;border-radius:999px;padding:6px 12px;font-weight:700;font-size:calc(12.5px * var(--fs));min-height:38px}

:root[data-hc="1"] .helpers button{background:#000;color:#fff;border-color:#fff}
.cfoot{text-align:center;font-family:var(--f-display);font-weight:800;font-size:calc(11.5px * var(--fs));letter-spacing:.04em;border-top:2px solid rgba(0,0,0,.5);padding-top:8px;margin-top:12px;color:var(--en)}
:root[data-hc="1"] .cfoot{border-color:#fff}
.alines{display:flex;flex-direction:column;gap:12px;margin:12px 0}

.player.on .wave i{opacity:1;animation:eq .8s ease-in-out infinite}

.player.on button{background:currentColor}
.player.on button span,.player.on button svg{color:#fff}
:root[data-hc="1"] .player.on button span,:root[data-hc="1"] .player.on button svg{color:#000}
.ill{display:flex;justify-content:center;margin:4px 0 6px}
.ill img{max-height:170px;max-width:100%;border-radius:6px;background:#fff}

.judge .btn{flex:1;min-width:150px;max-width:260px}
.ytl{font-size:calc(12.5px * var(--fs));color:var(--ink-soft);text-align:center;margin-top:8px}

.choose3{display:flex;flex-direction:column;gap:8px;margin:10px 0}

/* secret box */
.boxdlg .sheet{text-align:center;background:linear-gradient(160deg,#fff 0%,#fff6fd 100%)}

.boxcard{border:6px solid #ffde59;border-radius:14px;padding:16px;background:var(--paper);margin:8px auto 14px;max-width:520px}

.boxcard .kk{color:var(--kk)}.boxcard .ru{color:var(--ru)}.boxcard .en{color:var(--en)}
.boxcard.neg{border-color:#5ce7ff}

/* library */
.libbar{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.libbar input{flex:1 1 220px;border:2px solid var(--rail-line);border-radius:10px;padding:10px 12px;min-height:46px;background:var(--paper)}
.libbar select{border:2px solid var(--rail-line);border-radius:10px;padding:8px 10px;min-height:46px;background:var(--paper)}
.liblist{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,230px),1fr));gap:8px;list-style:none;margin:0;padding:0}
.liblist button{width:100%;height:100%;text-align:left;border:0;border-left:8px solid var(--c);background:var(--paper);border-radius:8px;padding:10px 12px;display:flex;flex-direction:column;gap:4px;box-shadow:0 1px 0 rgba(0,0,0,.1);color:var(--ink)}
.liblist .q{font-weight:800;color:var(--kk);font-size:calc(13.5px * var(--fs));line-height:1.3}
.liblist .m{font-size:calc(11.5px * var(--fs));color:var(--ink-soft)}
.libcount{font-size:calc(13px * var(--fs));color:var(--ink-soft);margin:0 0 8px}

/* accessibility panel */
.a11y-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,280px),1fr));gap:12px}
.opt{display:flex;flex-direction:column;gap:8px;padding:12px;border:2px solid var(--rail-line);border-radius:12px;background:var(--paper)}
.opt .lab{font-weight:800}
.opt small{color:var(--ink-soft);font-size:calc(12.5px * var(--fs))}
.opt select,.opt input[type=range]{width:100%;min-height:40px}
.switch{display:flex;align-items:center;justify-content:space-between;gap:10px;cursor:pointer;font-weight:800}
.switch input{width:52px;height:30px;appearance:none;-webkit-appearance:none;background:#cdbdb3;border-radius:99px;position:relative;flex:none;cursor:pointer;transition:background .2s}
.switch input::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:left .2s}
.switch input:checked{background:var(--good)}
.switch input:checked::after{left:25px}
.note{font-size:calc(13px * var(--fs));background:#fff4cf;color:#4a3300;border-radius:10px;padding:10px 12px;margin:10px 0 0}
:root[data-hc="1"] .note{background:#111;color:#ffef7a;border:1px solid #ffef7a}
.kbd{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;font-size:calc(13.5px * var(--fs));margin:0}
.kbd dt kbd{display:inline-block;min-width:28px;text-align:center;border:2px solid var(--rail-line);border-bottom-width:4px;border-radius:6px;padding:1px 6px;font-family:var(--f-display);font-weight:800;background:var(--paper)}
.kbd dd{margin:0}

/* rules */
.rules h3{font-family:var(--f-display);font-weight:900;font-size:calc(16px * var(--fs));margin:16px 0 6px}
.rules ul{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:4px}
.rules p{margin:0 0 6px;max-width:70ch}

/* results */
.podium{list-style:none;margin:10px 0;padding:0;display:flex;flex-direction:column;gap:8px}
.podium li{display:grid;grid-template-columns:40px 40px minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 12px;border-radius:12px;background:var(--paper);border:2px solid var(--rail-line)}
.podium li.win{border-color:#e0b100;background:#fff8d6}

.podium .pl{font-family:var(--f-display);font-weight:900;font-size:calc(22px * var(--fs));text-align:center}
.podium .tk{width:38px;height:38px}
.podium .sc{font-family:var(--f-display);font-weight:900;font-size:calc(24px * var(--fs));font-variant-numeric:tabular-nums}
.order-list{list-style:none;margin:10px 0;padding:0;display:flex;flex-direction:column;gap:8px}
.order-list li{display:grid;grid-template-columns:38px minmax(0,1fr) 54px;align-items:center;gap:10px;padding:8px 10px;border:2px solid var(--rail-line);border-radius:12px;background:var(--paper)}
.order-list .tk{width:36px;height:36px}
.mini{width:46px;height:46px;border:3px solid #222;border-radius:9px;background:#fff;display:grid;grid-template:repeat(3,1fr)/repeat(3,1fr);padding:5px}
.mini i{width:8px;height:8px;border-radius:50%;background:#111;align-self:center;justify-self:center}

.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:100;background:#1b1512;color:#fff;padding:12px 18px;border-radius:12px;font-weight:700;max-width:min(560px,calc(100vw - 32px));box-shadow:0 8px 30px rgba(0,0,0,.4);text-align:center}

/* sentence case display option */

@media (max-width:560px){
  .sheet{padding:16px}
  .ql p{font-size:calc(16.5px * var(--fs))}

}
:root[data-motion="0"] *{animation-duration:.001s!important;animation-iteration-count:1!important;transition-duration:.001s!important}

</style>

/* speak(list of {text,lang}) sequentially; chunked by sentence to avoid Chrome cut-offs */
function speakChunks(text,lang){ return speechText(text).split(/(?<=[.!?;:])\s+/).filter(c=>c.trim()).map(c=>({text:c,lang})); }
function speak(parts, key){
  stopSpeech();
  const my=++SPEECH.token;
  const q=[];
  for(const p of parts){ if(!p.text) continue;
    if(p.lang==='kk'){ const src=kkClip(p.text); if(src){ q.push({src,text:p.text,lang:'kk'}); continue; } }
    q.push(...speakChunks(p.text,p.lang)); }
  if(!q.length) return;
  if(!SPEECH.ok && !q.some(x=>x.src)){ toast(t('noVoice')); return; }
  setPlaying(key||null);
  let i=0;
  const next=()=>{
    if(my!==SPEECH.token) return;
    if(i>=q.length){ setPlaying(null); return; }
    const it=q[i++];
    if(it.src){
      const a=new Audio(it.src); KKAUDIO.el=a; a.playbackRate=prefs.rate||1; try{ a.preservesPitch=true; }catch(e){}
      let done=false;
      a.onended=()=>{ if(done) return; done=true; next(); };
      a.onerror=()=>{ if(done) return; done=true; if(SPEECH.ok) q.splice(i,0,...speakChunks(it.text,'kk')); next(); };
      const pr=a.play(); if(pr&&pr.catch) pr.catch(()=>a.onerror());
      return;
    }
    if(!SPEECH.ok){ next(); return; }
    const u=new SpeechSynthesisUtterance(it.text);
    let l=it.lang, v=bestVoice(l);
    if(!v && l==='kk'){ v=bestVoice('ru'); l='ru'; if(!kkHintShown){ kkHintShown=true; toast(t('kkHint')); } }
    u.lang=v?v.lang:LANGTAG[l]; if(v) u.voice=v;
    u.rate=prefs.rate; u.pitch=1;
    u.onend=next; u.onerror=next;
    speechSynthesis.speak(u);
  };
  next();
}
function toggleSay(key,parts){ if(playingKey===key){ stopSpeech(); } else speak(parts,key); }
function announce(msg, assertive){ const n=$(assertive?'#liveA':'#live'); n.textContent=''; setTimeout(()=>{ n.textContent=msg; },30); if(prefs.auto) speak([{text:msg,lang:prefs.autoLang==='ui'?UI:prefs.autoLang}],'__auto'); }

let AC=null;
function beep(type){
  if(!prefs.sfx) return;
  try{
    AC=AC||new (window.AudioContext||window.webkitAudioContext)();
    const seq={tick:[[880,.04]],roll:[[300,.05],[420,.05],[360,.05],[500,.05],[440,.06]],ok:[[660,.1],[880,.1],[1175,.18]],bad:[[330,.15],[220,.25]],box:[[523,.08],[659,.08],[784,.08],[1047,.2]],end:[[392,.12],[523,.12],[659,.12],[784,.3]],timeup:[[700,.12],[0,.06],[700,.12]]}[type]||[[600,.05]];
    let tt=AC.currentTime;
    for(const [f,d] of seq){ if(f){ const o=AC.createOscillator(),g=AC.createGain(); o.type=type==='tick'?'square':'triangle'; o.frequency.value=f; g.gain.setValueAtTime(.0001,tt); g.gain.exponentialRampToValueAtTime(.18,tt+.01); g.gain.exponentialRampToValueAtTime(.0001,tt+d); o.connect(g).connect(AC.destination); o.start(tt); o.stop(tt+d+.02);} tt+=d; }
  }catch(e){}
}

function placeTokens(animIdx){

  const board=$('#board');

  S.teams.forEach((tm,i)=>{ (groups[tm.pos]=groups[tm.pos]||[]).push(i); });
  const offs=[[0,0]],o2=[[-.22,-.18],[.22,.18]],o3=[[-.22,-.2],[.22,-.2],[0,.22]],o4=[[-.22,-.22],[.22,-.22],[-.22,.22],[.22,.22]],o6=[[-.25,-.25],[.25,-.25],[-.25,0],[.25,0],[-.25,.25],[.25,.25]];
  const pick=n=>n===1?offs:n===2?o2:n===3?o3:n===4?o4:o6;
  S.teams.forEach((tm,i)=>{
    let tk=layer.querySelector(`[data-tm="${i}"]`);
    if(!tk){ const tok=tokById(tm.token); tk=el('div',{class:'tok','data-tm':i,style:`--tc:${tok.c};--ti:${tok.i}`}); tk.innerHTML=TOK_ICONS[tok.id]; layer.append(tk); }

    const g=groups[tm.pos], k=g.indexOf(i), of=pick(g.length)[k]||[0,0];
    const cw=cell.offsetWidth, ch=cell.offsetHeight;
    const ts=Math.max(16, cw*(g.length>2?.5:g.length===2?.62:.78));
    tk.style.setProperty('--ts',ts+'px');

  });
  layer.querySelectorAll('.tok').forEach(n=>{ if(+n.dataset.tm>=S.teams.length) n.remove(); });
  labelCells();
}

/* ================= clock ================= */
let clockTimer=null;
function startClock(){
  clearInterval(clockTimer);
  const c=$('#clock');
  if(!S||S.phase!=='play'||!S.settings.gameMin){ c.hidden=true; return; }
  c.hidden=false;
  const tick=()=>{
    if(!S||S.phase!=='play'){ c.hidden=true; clearInterval(clockTimer); return; }
    const left=Math.max(0,S.endAt-Date.now());
    const m=Math.floor(left/60000), s=Math.floor(left/1000)%60;
    c.innerHTML=`<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l3 2M9 2h6"/></svg>${m}:${String(s).padStart(2,'0')}`;
    c.setAttribute('aria-label',`${m} ${t('min')} ${s} ${t('sec')}`);
    c.classList.toggle('low',left<5*60000);
    if(left<=0 && !S.timeOver){ S.timeOver=true; save(); addLog(t('timeOver')); toast(t('timeOver')); announce(t('timeOver'),true); beep('end'); renderRail(); if(!S.busy) setTimeout(finishGame,800); }
  };
  tick(); clockTimer=setInterval(tick,1000);
}

  if(!ok && CC.retry){ CC.retry=false; toast(boxShort('retry')); announce(boxShort('retry')); CC.flipped=false; if(CC.time){ CC.left=CC.time; startQTimer(); } renderCard(); return; }
  stopSpeech();
  if(ok){ const p=(c.l===2?2:1)*(CC.sure?2:1); tm.score+=p; addLog(t('gotPts',tm.name,p)); announce(t('gotPts',tm.name,p)); beep('ok'); }
  else { addLog(t('noPts',tm.name)); announce(t('noPts',tm.name)); beep('bad'); }
  const extra=ok&&CC.photo;
  if(CC.ctx.tiebreak){ closeCard(true); finishGame(true); return; }
  closeCard(true);
  endTurn(extra);
}
function closeCard(fromJudge){

}

function shielded(tm){ if(tm.cards.includes('shield')){ takeCard(tm,'shield'); addLog(`${tm.name}: ${t('boxShield')}`); toast(t('boxShield')); return true; } return false; }
async function applyBox(id,target){
  const me=curTeam(), mi=teamIdx();
  $('#boxDlg').close(); stopSpeech();
  S.pending=null;
  let ask=true; // ask a question after the card?
  switch(id){
    case 'optic': S.teams.forEach((x,i)=>{ if(i!==mi && x.score>0 && !shielded(x)){ x.score--; me.score++; } }); break;
    case 'grav': if(!shielded(me)) await moveSteps(mi,-1); break;
    case 'eureka': me.score+=3; beep('ok'); ask=false; break;
    case 'atm': S.teams.forEach(x=>{ if(!shielded(x)) x.score=Math.max(0,x.score-1); }); break;
    case 'magnet': { const x=S.teams[target]; if(!shielded(x)){ x.pos=me.pos; placeTokens(target); } break; }
    case 'vacuum': if(!shielded(me)) me.cards=[]; break;
    case 'reso': S.teams.forEach(x=>x.score++); break;
    case 'laser': await moveSteps(mi,3); break;
    case 'hole': if(!shielded(me)){ me.pos=0; placeTokens(mi); ask=false; } break;
    case 'zero': S.frozenUntil=S.turnCount+S.teams.length; break;
    default: me.cards.push(id);
  }
  save(); renderRail();
  if(ask) landed(true); else endTurn(false);
}

function finishGame(afterTie){

  if(!afterTie){ S.teams.forEach(x=>{ const n=x.cards.filter(c=>c==='nobel').length; if(n){ x.score+=5*n; x.nobel=5*n; x.cards=x.cards.filter(c=>c!=='nobel'); } }); }
  S.phase='over'; S.busy=false; save();
  $('#clock').hidden=true;
  beep('end');

  const top=S.teams[ranked[0]].score; const tied=ranked.filter(i=>S.teams[i].score===top);

  body.append(el('h2',{id:'overH'},t('overTitle')),el('p',{class:'lead'},t('overLead')));

  body.append(ol);

    tied.forEach(i=>tb.append(el('button',{class:'btn sec',type:'button',onclick:()=>{ $('#overDlg').close(); const ps=playSecs(); const sec=ps[Math.floor(Math.random()*ps.length)]||SEC_ORDER[0]; let ids=poolFor(sec).filter(j=>CARDS[j].l===2); if(!ids.length) ids=poolFor(sec); if(!ids.length) ids=CARDS.map((c,j)=>c.s===sec&&c.l===2?j:-1).filter(j=>j>=0); S.phase='play'; S.order=S.teams.map((_,j)=>j); S.turn=i; openCard(ids[Math.floor(Math.random()*ids.length)],{mode:'game',team:i,tiebreak:true}); }},tkEl(S.teams[i].token),S.teams[i].name)));
    body.append(el('p',{class:'note'},t('tie')),tb);
  } else announce(`${t('winner')}: ${S.teams[ranked[0]].name}, ${t('ptN',top)}`);
  body.append(el('h3',{style:'font-family:var(--f-display);margin:16px 0 6px'},t('reflect')),el('ul',null,...t('reflectQ').map(q=>el('li',null,q))));
  body.append(el('div',{class:'actions'},el('button',{class:'btn sec',type:'button',onclick:()=>$('#overDlg').close()},t('close')),el('button',{class:'btn pri',type:'button',onclick:()=>{ $('#overDlg').close(); newGame(true); }},t('newGame'))));
  renderRail();
  if(!$('#overDlg').open) $('#overDlg').showModal();
}

document.addEventListener('keydown',e=>{
  if(e.target.closest('input,select,textarea')||e.ctrlKey||e.metaKey||e.altKey) return;
  const k=e.key.toLowerCase();
  if($('#cardDlg').open && CC){
    if(k==='a'){ e.preventDefault(); flipCard(); }
    else if(['1','2','3'].includes(k)){ e.preventDefault(); const l=['kk','ru','en'][+k-1]; const j=+k-1; const c=CARDS[CC.id]; if(CC.flipped){ const parts=[{text:c.a[j],lang:l}]; if(c.f) parts.push({text:c.f,lang:l==='kk'?'ru':l}); toggleSay('a'+l,parts); } else toggleSay('q'+l,[{text:c.q[j],lang:l}]); }
    else if(k==='y' && CC.flipped && CC.ctx.mode==='game'){ e.preventDefault(); judge(true); }
    else if(k==='n' && CC.flipped && CC.ctx.mode==='game'){ e.preventDefault(); judge(false); }
    else if(k==='s'){ stopSpeech(); }
    return;
  }
  if(document.querySelector('dialog[open]')) { if(k==='s') stopSpeech(); return; }
  if(k==='r'){ e.preventDefault(); rollDice(); }
  else if(k==='s'){ stopSpeech(); }
});
